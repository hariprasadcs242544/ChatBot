<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A clean, modern Gemini-powered AI chatbot. Ask anything and get intelligent responses with conversation memory." />
  <title>My Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- App Shell -->
  <div class="app" id="app">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Chat sidebar">
      <div class="sidebar-header">
        <div class="logo" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="14" cy="14" r="14" fill="url(#logoGrad)"/>
            <path d="M14 7C14 7 9 10.5 9 14.5C9 17.5 11.2 20 14 20C16.8 20 19 17.5 19 14.5C19 10.5 14 7 14 7Z" fill="white" opacity="0.9"/>
            <path d="M14 11C14 11 11 13 11 15.2C11 16.8 12.3 18 14 18C15.7 18 17 16.8 17 15.2C17 13 14 11 14 11Z" fill="url(#logoGrad2)"/>
            <defs>
              <linearGradient id="logoGrad" x1="0" y1="0" x2="28" y2="28" gradientUnits="userSpaceOnUse">
                <stop stop-color="#4F8EF7"/>
                <stop offset="1" stop-color="#7C3AED"/>
              </linearGradient>
              <linearGradient id="logoGrad2" x1="11" y1="11" x2="17" y2="18" gradientUnits="userSpaceOnUse">
                <stop stop-color="#4F8EF7"/>
                <stop offset="1" stop-color="#7C3AED"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <span class="logo-text">My Assistant</span>
      </div>

      <button class="new-chat-btn" id="newChatBtn" aria-label="Start a new chat">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        New Chat
      </button>

      <div class="sidebar-footer">
        <div class="model-badge" title="Powered by Gemini 2.5 Flash Lite">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <circle cx="7" cy="7" r="7" fill="url(#mbGrad)"/>
            <path d="M7 3.5C7 3.5 4.5 5.25 4.5 7.25C4.5 8.75 5.6 10 7 10C8.4 10 9.5 8.75 9.5 7.25C9.5 5.25 7 3.5 7 3.5Z" fill="white" opacity="0.9"/>
            <defs>
              <linearGradient id="mbGrad" x1="0" y1="0" x2="14" y2="14" gradientUnits="userSpaceOnUse">
                <stop stop-color="#4F8EF7"/>
                <stop offset="1" stop-color="#7C3AED"/>
              </linearGradient>
            </defs>
          </svg>
          Gemini 2.5 Flash Lite
        </div>
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="chat-main" id="chatMain">

      <!-- Top Bar -->
      <header class="topbar" role="banner">
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar" aria-expanded="true">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
        <h1 class="topbar-title">New Conversation</h1>
        <button class="new-chat-btn-top" id="newChatBtnTop" aria-label="Start a new chat" title="New chat">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M9 3.5v11M3.5 9h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </header>

      <!-- Message List -->
      <section class="messages" id="messages" aria-live="polite" aria-label="Chat messages">

        <!-- Empty State -->
        <div class="empty-state" id="emptyState">
          <div class="empty-state-icon" aria-hidden="true">
            <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
              <circle cx="28" cy="28" r="28" fill="url(#esGrad)"/>
              <path d="M28 14C28 14 18 20 18 28C18 34 22.5 39 28 39C33.5 39 38 34 38 28C38 20 28 14 28 14Z" fill="white" opacity="0.85"/>
              <path d="M28 22C28 22 22 26 22 29.5C22 32.2 24.7 34.5 28 34.5C31.3 34.5 34 32.2 34 29.5C34 26 28 22 28 22Z" fill="url(#esGrad2)"/>
              <defs>
                <linearGradient id="esGrad" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#4F8EF7"/>
                  <stop offset="1" stop-color="#7C3AED"/>
                </linearGradient>
                <linearGradient id="esGrad2" x1="22" y1="22" x2="34" y2="34.5" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#4F8EF7"/>
                  <stop offset="1" stop-color="#7C3AED"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <h2 class="empty-state-title">How can I help you today?</h2>
          <p class="empty-state-sub">Ask me anything — My Assistant is here to help.</p>
          <div class="starter-prompts" role="list" aria-label="Suggested conversation starters">
            <button class="starter-prompt" role="listitem" data-prompt="Explain quantum computing in simple terms that a high school student can understand.">
              <span class="starter-icon" aria-hidden="true">⚛️</span>
              <span>Explain quantum computing simply</span>
            </button>
            <button class="starter-prompt" role="listitem" data-prompt="Write a short Python function that checks if a string is a palindrome, with comments explaining each step.">
              <span class="starter-icon" aria-hidden="true">🐍</span>
              <span>Write a Python palindrome checker</span>
            </button>
            <button class="starter-prompt" role="listitem" data-prompt="What are the top 5 productivity tips backed by science? Format them as a numbered list with a brief explanation for each.">
              <span class="starter-icon" aria-hidden="true">🧠</span>
              <span>Top science-backed productivity tips</span>
            </button>
          </div>
        </div>

      </section>

      <!-- Typing Indicator (hidden until needed) -->
      <div class="typing-indicator" id="typingIndicator" aria-live="polite" aria-label="Gemini is typing" hidden>
        <div class="typing-bubble">
          <div class="typing-avatar" aria-hidden="true">G</div>
          <div class="typing-dots" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>

      <!-- Composer -->
      <footer class="composer-wrapper" role="contentinfo">
        <div class="composer" id="composer">
          <textarea
            id="userInput"
            class="composer-textarea"
            placeholder="Message Gemini…"
            rows="1"
            aria-label="Type your message"
            aria-multiline="true"
            autocomplete="off"
            spellcheck="true"
          ></textarea>
          <button class="send-btn" id="sendBtn" aria-label="Send message" disabled>
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M3 10L17 3L10 17L9 11L3 10Z" fill="currentColor"/>
            </svg>
          </button>
        </div>
        <p class="composer-hint">Gemini can make mistakes. Enter to send, Shift+Enter for new line.</p>
      </footer>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
